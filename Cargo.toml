[package]
name = "clview"
# `--help`'s first line.
description = "Command-line Viewer: view graphic files without leaving your terminal"
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
# Where `--help` ends by sending the reader.
repository = "https://github.com/dobladez/clview"
# pdfcraft is a git dependency, which crates.io refuses.
publish = false

[[bin]]
name = "clv"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# pdfcraft is not on crates.io: its crates come from one pinned commit of its `main`. Moving the
# pin means moving every `rev` below together, the [patch.crates-io] ones included;
# tests/it/pdfcraft_pin.rs fails when they disagree or pdfcraft patches a crate this file doesn't.
[dependencies]
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "17fc47b6927bf787aef2c56cf59c365e64574906", optional = true }
pdfcraft-engine = { git = "https://github.com/storytold/pdfcraft", rev = "17fc47b6927bf787aef2c56cf59c365e64574906", optional = true }
# A PDF's page sizes for a list's tile, read as pdfcraft reads them, without its pass over every
# page's annotations (ADR-0042): pdfcraft's own hayro-syntax, the one [patch.crates-io] pins.
hayro-syntax = { version = "=0.7.2", default-features = false, optional = true }
# Images, decoded in Rust: the `image` crate's decoders (no rayon: the pager has threads of its
# own), and jxl-oxide for JPEG XL. Not AVIF: the `image` crate's AVIF decoder (`avif-native`,
# the dav1d C library) turns most files' colours, as libavif writes them, through the wrong
# YUV matrix in 0.25.10.
image = { version = "0.25.10", default-features = false, features = ["bmp", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"], optional = true }
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image"], optional = true }
# Zip archives, read in Rust: deflate through zlib-rs, deflate64, bzip2 through libbz2-rs-sys, LZMA
# and XZ. Not zstd (the zstd C library), and no encrypted entries.
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz"], optional = true }
# SVG drawings, rendered in Rust by resvg (usvg parses, tiny-skia paints): text with the system's
# fonts, and the JPEG, PNG, GIF and WebP pictures a drawing embeds. Not resvg's own svgz, whose
# gunzip has no cap: `source/svg.rs` unpacks one itself, through flate2 (which png already
# builds), and asks imagesize (which usvg already builds) how large an embedded picture is.
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"], optional = true }
flate2 = { version = "1.1", optional = true }
imagesize = { version = "0.15", optional = true }
# An SVG's HTML labels (`<foreignObject>`: tldraw, draw.io, Mermaid), laid out and painted by
# Blitz (Stylo's styles, Taffy's layout, Parley's text) through anyrender into vello_cpu, in Rust:
# `source/svg/html.rs`, ADR-0025, in a worker process of clv's own (ADR-0026). Pinned, for their
# API: blitz-paint 0.3.0-beta.4's shapes are what the memory test's drawing grows by. Without
# Blitz's default features, which bring its own SVG (usvg, without this backend's bounds) and the
# system's fonts through fontconfig on Linux, which a static musl build can't link: the worker
# registers the fonts fontdb finds for resvg instead (ADR-0026's update). With WOFF fonts. No
# JavaScript, no network.
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["woff"], optional = true }
blitz-html = { version = "=0.3.0-beta.4", optional = true }
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, optional = true }
blitz-traits = { version = "=0.3.0-beta.4", optional = true }
anyrender = { version = "=0.14.0", optional = true }
anyrender_vello_cpu = { version = "=0.18.0", optional = true }
# The transforms anyrender takes; Blitz builds it already.
kurbo = { version = "0.13", optional = true }
# Parley's font collection (fontique), to register the system's fonts fontdb found into Blitz's
# font context, and its generic families; Blitz builds it already. Without its `system` feature,
# which is fontconfig on Linux.
parley = { version = "=0.12.0", default-features = false, features = ["std"], optional = true }
# Stylo, to read a drawing's stylesheets as Blitz will and write them out again without their
# `@import`s, so no stylesheet is ever fetched; Blitz builds it already, and doesn't re-export it.
stylo = { version = "=0.22.0", optional = true }
# SVG's lengths, transforms, viewBoxes and colours, to place a label as usvg places what it draws;
# usvg builds it already.
svgtypes = { version = "0.16", optional = true }
# Mermaid diagrams, turned into SVG in Rust by merman (its parser, its Cytoscape layout and its
# SVG), in a worker process of clv's own: `source/mermaid.rs`, ADR-0031. Without its default
# features: not ELK's layout (EPL-2.0), nor what reads the system's fonts or the clock, nor its
# PNG, PDF, ASCII or math. Pinned, for its limits and its layout's cost, which the worker's caps
# rest on: measured again with docs/adr/0031-measure/ when it moves.
merman = { version = "=0.10.0", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"], optional = true }
# Tar archives and compressed files, read in Rust: gzip through flate2 (zlib-rs), bzip2 through
# libbz2-rs-sys, xz through lzma-rust2 (the decoders the zip backend already builds), with a tar
# reader of `source/tar.rs`'s own. Not zstd (the zstd C library), as for zip.
bzip2 = { version = "0.6", optional = true }
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz"], optional = true }
# Ebooks (epub): rbook reads a book's package (its reading order, its cover, its table of
# contents), in a worker process of clv's own, since it can panic, recurse without bound and read
# without a cap on a hostile file: `source/epub.rs`, ADR-0038. Without its default features: not
# its writer, its prelude, nor `threadsafe` (the worker reads on one thread). Pinned, for what
# reading a package costs, which the worker's caps rest on: measured again with
# docs/adr/0038-measure/ when it moves.
rbook = { version = "=0.7.13", default-features = false, optional = true }
# Org-mode documents, parsed by orgize (its lossless tree, in Rust) and written as HTML for the
# documents' backend, in a worker process of clv's own, since its time grows as the square of
# what a file nests and it overflows a stack on what it nests deepest: `source/org.rs`, ADR-0040.
# Pinned, for what parsing costs, which the worker's caps rest on, and for the two mistakes of
# its that `source/org.rs` works around: measured again with docs/adr/0040-measure/ when it moves.
orgize = { version = "=0.10.0-alpha.10", optional = true }
# Markdown, into the HTML wordcraft's importer reads, which can be given pictures: ADR-0014.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"], optional = true }
# Word documents, OpenDocument text, RTF, Markdown and HTML, read, laid out and drawn in Rust by
# wordcraft, a git dependency like pdfcraft, from one pinned commit of its `main` (every `rev` below
# moves together; tests/it/wordcraft.rs checks it). Its reading, layout and drawing crates only: not
# its engine, which brings PDF export and the [patch.crates-io] that needs.
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "bbe3547dd11bb5f613f3aa893b12f593910644de", optional = true }
wordcraft-docx = { git = "https://github.com/storytold/wordcraft", rev = "bbe3547dd11bb5f613f3aa893b12f593910644de", optional = true }
wordcraft-docbin = { git = "https://github.com/storytold/wordcraft", rev = "bbe3547dd11bb5f613f3aa893b12f593910644de", optional = true }
wordcraft-formats = { git = "https://github.com/storytold/wordcraft", rev = "bbe3547dd11bb5f613f3aa893b12f593910644de", optional = true }
wordcraft-layout = { git = "https://github.com/storytold/wordcraft", rev = "bbe3547dd11bb5f613f3aa893b12f593910644de", optional = true }
wordcraft-render = { git = "https://github.com/storytold/wordcraft", rev = "bbe3547dd11bb5f613f3aa893b12f593910644de", optional = true }
# Spreadsheets, read, recalculated and printed to a PDF in Rust by gridcraft's engine, a git
# dependency like pdfcraft, pinned to one commit of its `main` (tests/it/gridcraft.rs checks it).
# The engine because its print layout is there; it needs none of the crates gridcraft patches.
gridcraft-engine = { git = "https://github.com/storytold/gridcraft", rev = "1d0b311b4a943e19c86f1bfaf85927c3116ea92a", optional = true }
# The parameters of a gridcraft command (fitting a CSV's columns), and merman's site config, already
# in both their trees.
serde_json = { version = "1", optional = true }
base64 = "0.23"
png = "0.18"
# The reader's config, `~/.config/clv/config.toml`: TOML, parsed in Rust with the place of every key
# and value, so that an error names its line (`view/config.rs`, ADR-0043). Its parser alone: not
# serde, which it needs only to fill a struct, nor its writer. Stylo's build already builds this
# version, so `Cargo.lock` holds one.
toml = { version = "1", default-features = false, features = ["std", "parse"] }

[features]
default = ["pdf", "image", "svg", "svg-html", "mermaid", "zip", "tar", "word", "sheet", "epub", "org"]
# PDFs: the PDF backend, `source/pdfcraft.rs`, which renders them through pdfcraft. Without it the
# viewer builds without pdfcraft at all, and shows no PDFs.
pdf = ["dep:pdfcraft-render", "dep:pdfcraft-engine", "dep:hayro-syntax"]
# Images: PNG, JPEG, GIF, WebP, TIFF, BMP, ICO, QOI, JPEG XL, OpenEXR, Radiance HDR, TGA, PNM
# and farbfeld (`source/image.rs` lists them as `DECODED`).
image = ["dep:image", "dep:jxl-oxide"]
# SVG drawings, and svgz (gzipped SVG): `source/svg.rs`, which renders them through resvg.
svg = ["dep:resvg", "dep:flate2", "dep:imagesize"]
# An SVG's HTML labels, drawn by Blitz over what resvg draws: `source/svg/html.rs`. It brings the
# image crate for the pictures a label embeds, whether or not the image backend is built.
svg-html = [
    "svg",
    "dep:image",
    "dep:blitz-dom",
    "dep:blitz-html",
    "dep:blitz-paint",
    "dep:blitz-traits",
    "dep:anyrender",
    "dep:anyrender_vello_cpu",
    "dep:kurbo",
    "dep:parley",
    "dep:stylo",
    "dep:svgtypes",
]
# Mermaid diagrams (`.mmd`, `.mermaid`): `source/mermaid.rs`, which turns them into SVG through
# merman, in a worker process, for the SVG backend to show, so it brings that backend too.
mermaid = ["dep:merman", "dep:serde_json", "svg"]
# Zip archives (and what is a zip inside: jar, cbz, epub…), as directories: `source/zip.rs`.
zip = ["dep:zip"]
# Tar archives, plain or compressed (gzip, bzip2, xz), as directories, and a file compressed
# alone as that file: `source/tar.rs`.
tar = ["dep:flate2", "dep:bzip2", "dep:lzma-rust2"]
# Word documents (docx, doc), OpenDocument text, RTF, Markdown and HTML: `source/wordcraft.rs`,
# which lays them out and draws them through wordcraft.
word = ["dep:wordcraft-doc", "dep:wordcraft-docx", "dep:wordcraft-docbin", "dep:wordcraft-formats", "dep:wordcraft-layout", "dep:wordcraft-render", "dep:pulldown-cmark"]
# Ebooks (epub), as books: `source/epub.rs`, which has rbook read a book's package in a worker
# process and joins its chapters into one HTML document for the documents' backend to show, so it
# brings that backend too, and the zip crate to read the book's files.
epub = ["dep:rbook", "dep:zip", "word"]
# Org-mode documents (`.org`): `source/org.rs`, which has orgize parse them in a worker process and
# writes them as HTML for the documents' backend to show, so it brings that backend too.
org = ["dep:orgize", "word"]
# Spreadsheets (xlsx, xls, xlsb, ods, csv): `source/gridcraft.rs`, which prints them to a PDF
# through gridcraft for the PDF backend to show, so it brings that backend too, and the zip crate
# to see what an xlsx's sheets unpack to before gridcraft reads them.
sheet = ["dep:gridcraft-engine", "dep:zip", "dep:serde_json", "pdf"]

[target.'cfg(unix)'.dependencies]
# The terminal's size and raw mode (`termios`), and the user and process ids for the temporary
# files (`process`): safe calls, so no `unsafe` libc.
# The CPU time a worker process has used (`time`), to cap what it may use next (`process`).
rustix = { version = "1", features = ["process", "termios", "time"] }
# The allocator of the whole process, which counts what it holds: a worker process sets it a
# limit, past which an allocation fails and the worker aborts (`source/worker.rs`, ADR-0026);
# the viewer's has none.
cap = "0.1.2"
# The system's clipboard, for the pager's `c` on a terminal on this machine that has no clipboard
# of its own for pictures (Ghostty, WezTerm): the macOS pasteboard, X11 (XWayland too). Only
# `image-data`: not Wayland's data-control protocol. ADR-0009 has why.
arboard = { version = "3.7", default-features = false, features = ["image-data"] }

[dev-dependencies]
# Test images, made by the tests. pdfcraft-cos encrypts PDFs for the PDF backend's own tests
# (tests/it/pdfcraft.rs).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# Test archives, made by the tests (source/zip.rs, tests/it/zip.rs; source/tar.rs, tests/it/tar.rs,
# which compress with the encoders of the same crates the tar backend decodes with).
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = "1.1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz", "encoder"] }
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "17fc47b6927bf787aef2c56cf59c365e64574906" }
# Encrypted Word documents for the Word backend's own tests (tests/it/wordcraft.rs).
wordcraft-docx = { git = "https://github.com/storytold/wordcraft", rev = "bbe3547dd11bb5f613f3aa893b12f593910644de" }
# Encrypted workbooks for the spreadsheet backend's own tests (tests/it/gridcraft.rs): its
# `test-support` feature, never in a build of clv.
gridcraft-xlsx = { git = "https://github.com/storytold/gridcraft", rev = "1d0b311b4a943e19c86f1bfaf85927c3116ea92a", features = ["test-support"] }
proptest = "1"
serde_json = "1"
# The manifests the pins' tests read (tests/it/pdfcraft_pin.rs, wordcraft.rs, gridcraft.rs), as
# tables: serde, which clv itself builds toml without.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

# The renderer's patched hayro, lopdf, vello_common and vello_cpu, from pdfcraft's `vendor/` at the
# same commit. pdfcraft applies them with its own [patch.crates-io], which Cargo honours only in the
# root manifest, so without these the stock crates.io releases build silently, without its
# crash and rendering fixes.
[patch.crates-io]
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "17fc47b6927bf787aef2c56cf59c365e64574906" }
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "17fc47b6927bf787aef2c56cf59c365e64574906" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "17fc47b6927bf787aef2c56cf59c365e64574906" }
hayro-cmap = { git = "https://github.com/storytold/pdfcraft", rev = "17fc47b6927bf787aef2c56cf59c365e64574906" }
hayro-postscript = { git = "https://github.com/storytold/pdfcraft", rev = "17fc47b6927bf787aef2c56cf59c365e64574906" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "17fc47b6927bf787aef2c56cf59c365e64574906" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "17fc47b6927bf787aef2c56cf59c365e64574906" }
vello_common = { git = "https://github.com/storytold/pdfcraft", rev = "17fc47b6927bf787aef2c56cf59c365e64574906" }
vello_cpu = { git = "https://github.com/storytold/pdfcraft", rev = "17fc47b6927bf787aef2c56cf59c365e64574906" }

# Dependencies optimised even in debug builds: rendering a page unoptimised is slow enough to
# time the tests out. Our own code keeps line tables, so panics and backtraces still show lines.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
