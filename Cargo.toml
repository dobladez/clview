[package]
name = "clview"
# `--help`'s first line.
description = "Command-line Viewer: view graphic files without leaving your terminal"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
# Where `--help` ends by sending the reader.
repository = "https://github.com/dobladez/clview"
# pdfcraft is a git dependency, which crates.io refuses.
publish = false

[[bin]]
name = "clv"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# pdfcraft is not on crates.io: its crates come from one pinned commit of its `main`. Moving the
# pin means moving every `rev` below together, the [patch.crates-io] ones included;
# tests/it/pdfcraft_pin.rs fails when they disagree or pdfcraft patches a crate this file doesn't.
[dependencies]
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "d28d047a9e6ad5431ee3602a97ac483c0605fd9e", optional = true }
pdfcraft-engine = { git = "https://github.com/storytold/pdfcraft", rev = "d28d047a9e6ad5431ee3602a97ac483c0605fd9e", optional = true }
# Images, decoded in Rust: the `image` crate's decoders (no rayon: the pager has threads of its
# own), and jxl-oxide for JPEG XL. Not AVIF: the `image` crate's AVIF decoder (`avif-native`,
# the dav1d C library) turns most files' colours, as libavif writes them, through the wrong
# YUV matrix in 0.25.10.
image = { version = "0.25.10", default-features = false, features = ["bmp", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"], optional = true }
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image"], optional = true }
# Zip archives, read in Rust: deflate through zlib-rs, deflate64, bzip2 through libbz2-rs-sys, LZMA
# and XZ. Not zstd (the zstd C library), and no encrypted entries.
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz"], optional = true }
# SVG drawings, rendered in Rust by resvg (usvg parses, tiny-skia paints): text with the system's
# fonts, and the JPEG, PNG, GIF and WebP pictures a drawing embeds. Not resvg's own svgz, whose
# gunzip has no cap: `source/svg.rs` unpacks one itself, through flate2 (which png already
# builds), and asks imagesize (which usvg already builds) how large an embedded picture is.
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"], optional = true }
flate2 = { version = "1.1", optional = true }
imagesize = { version = "0.15", optional = true }
# Tar archives and compressed files, read in Rust: gzip through flate2 (zlib-rs), bzip2 through
# libbz2-rs-sys, xz through lzma-rust2 (the decoders the zip backend already builds), with a tar
# reader of `source/tar.rs`'s own. Not zstd (the zstd C library), as for zip.
bzip2 = { version = "0.6", optional = true }
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz"], optional = true }
# Word documents, OpenDocument text and RTF, read, laid out and drawn in Rust by wordcraft, a
# git dependency like pdfcraft, from one pinned commit of its `main` (every `rev` below moves
# together; tests/it/wordcraft.rs checks it). Its reading, layout and drawing crates only: not
# its engine, which brings PDF export and the [patch.crates-io] that needs.
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "5b5810fe1f6f815acc3fda27619f61d9bc08b615", optional = true }
wordcraft-docx = { git = "https://github.com/storytold/wordcraft", rev = "5b5810fe1f6f815acc3fda27619f61d9bc08b615", optional = true }
wordcraft-docbin = { git = "https://github.com/storytold/wordcraft", rev = "5b5810fe1f6f815acc3fda27619f61d9bc08b615", optional = true }
wordcraft-formats = { git = "https://github.com/storytold/wordcraft", rev = "5b5810fe1f6f815acc3fda27619f61d9bc08b615", optional = true }
wordcraft-layout = { git = "https://github.com/storytold/wordcraft", rev = "5b5810fe1f6f815acc3fda27619f61d9bc08b615", optional = true }
wordcraft-render = { git = "https://github.com/storytold/wordcraft", rev = "5b5810fe1f6f815acc3fda27619f61d9bc08b615", optional = true }
# Spreadsheets, read, recalculated and printed to a PDF in Rust by gridcraft's engine, a git
# dependency like pdfcraft, pinned to one commit of its `main` (tests/it/gridcraft.rs checks it).
# The engine because its print layout is there; it needs none of the crates gridcraft patches.
gridcraft-engine = { git = "https://github.com/storytold/gridcraft", rev = "1f4c67ef0a0200e48d832c7cbbb5570b743b7837", optional = true }
# The parameters of a gridcraft command (fitting a CSV's columns), already in its tree.
serde_json = { version = "1", optional = true }
base64 = "0.23"
png = "0.18"

[features]
default = ["pdf", "image", "svg", "zip", "tar", "word", "sheet"]
# PDFs: the PDF backend, `source/pdfcraft.rs`, which renders them through pdfcraft. Without it the
# viewer builds without pdfcraft at all, and shows no PDFs.
pdf = ["dep:pdfcraft-render", "dep:pdfcraft-engine"]
# Images: PNG, JPEG, GIF, WebP, TIFF, BMP, ICO, QOI, JPEG XL, OpenEXR, Radiance HDR, TGA, PNM
# and farbfeld (`source/image.rs` lists them as `DECODED`).
image = ["dep:image", "dep:jxl-oxide"]
# SVG drawings, and svgz (gzipped SVG): `source/svg.rs`, which renders them through resvg.
svg = ["dep:resvg", "dep:flate2", "dep:imagesize"]
# Zip archives (and what is a zip inside: jar, cbz, epub…), as directories: `source/zip.rs`.
zip = ["dep:zip"]
# Tar archives, plain or compressed (gzip, bzip2, xz), as directories, and a file compressed
# alone as that file: `source/tar.rs`.
tar = ["dep:flate2", "dep:bzip2", "dep:lzma-rust2"]
# Word documents (docx, doc), OpenDocument text and RTF: `source/wordcraft.rs`, which lays them
# out and draws them through wordcraft.
word = ["dep:wordcraft-doc", "dep:wordcraft-docx", "dep:wordcraft-docbin", "dep:wordcraft-formats", "dep:wordcraft-layout", "dep:wordcraft-render"]
# Spreadsheets (xlsx, xls, xlsb, ods, csv): `source/gridcraft.rs`, which prints them to a PDF
# through gridcraft for the PDF backend to show, so it brings that backend too, and the zip crate
# to see what an xlsx's sheets unpack to before gridcraft reads them.
sheet = ["dep:gridcraft-engine", "dep:zip", "dep:serde_json", "pdf"]

[target.'cfg(unix)'.dependencies]
# The terminal's size and raw mode (`termios`), and the user and process ids for the temporary
# files (`process`): safe calls, so no `unsafe` libc.
rustix = { version = "1", features = ["process", "termios"] }
# The system's clipboard, for the pager's `c` on a terminal on this machine that has no clipboard
# of its own for pictures (Ghostty, WezTerm): the macOS pasteboard, X11 (XWayland too). Only
# `image-data`: not Wayland's data-control protocol. ADR-0009 has why.
arboard = { version = "3.7", default-features = false, features = ["image-data"] }

[dev-dependencies]
# Test images, made by the tests. pdfcraft-cos encrypts PDFs for the PDF backend's own tests
# (tests/it/pdfcraft.rs).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# Test archives, made by the tests (source/zip.rs, tests/it/zip.rs; source/tar.rs, tests/it/tar.rs,
# which compress with the encoders of the same crates the tar backend decodes with).
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = "1.1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz", "encoder"] }
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "d28d047a9e6ad5431ee3602a97ac483c0605fd9e" }
# Encrypted Word documents for the Word backend's own tests (tests/it/wordcraft.rs).
wordcraft-docx = { git = "https://github.com/storytold/wordcraft", rev = "5b5810fe1f6f815acc3fda27619f61d9bc08b615" }
# Encrypted workbooks for the spreadsheet backend's own tests (tests/it/gridcraft.rs): its
# `test-support` feature, never in a build of clv.
gridcraft-xlsx = { git = "https://github.com/storytold/gridcraft", rev = "1f4c67ef0a0200e48d832c7cbbb5570b743b7837", features = ["test-support"] }
proptest = "1"
serde_json = "1"
toml = "0.9"

# The renderer's patched hayro, lopdf and vello_common, from pdfcraft's `vendor/` at the same
# commit. pdfcraft applies them with its own [patch.crates-io], which Cargo honours only in the
# root manifest, so without these the stock crates.io releases build silently, without its
# crash and rendering fixes.
[patch.crates-io]
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "d28d047a9e6ad5431ee3602a97ac483c0605fd9e" }
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "d28d047a9e6ad5431ee3602a97ac483c0605fd9e" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "d28d047a9e6ad5431ee3602a97ac483c0605fd9e" }
hayro-cmap = { git = "https://github.com/storytold/pdfcraft", rev = "d28d047a9e6ad5431ee3602a97ac483c0605fd9e" }
hayro-postscript = { git = "https://github.com/storytold/pdfcraft", rev = "d28d047a9e6ad5431ee3602a97ac483c0605fd9e" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "d28d047a9e6ad5431ee3602a97ac483c0605fd9e" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "d28d047a9e6ad5431ee3602a97ac483c0605fd9e" }
vello_common = { git = "https://github.com/storytold/pdfcraft", rev = "d28d047a9e6ad5431ee3602a97ac483c0605fd9e" }

# Dependencies optimised even in debug builds: rendering a page unoptimised is slow enough to
# time the tests out. Our own code keeps line tables, so panics and backtraces still show lines.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
