[package]
name = "measure"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone, its own workspace: not part of clv's build. Weighs the two Org parsers for ADR-0040.
[workspace]

[dependencies]
orgize = { version = "=0.10.0-alpha.10" }
org-rust-parser = { version = "=0.1.8" }

[profile.release]
debug = false

# `cargo build --profile checked`: as clv's dev profile builds its dependencies, debug assertions on.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true
