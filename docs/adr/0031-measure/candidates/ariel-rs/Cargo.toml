# Standalone, its own workspace: not part of clv's build. A Mermaid diagram to SVG through
# ariel-rs, for ADR-0031: `cargo build --release -j 2` here, then `target/release/t-ariel-rs <in.mmd> <out.svg>`,
# or `batch <dir>`.
[package]
name = "t-ariel-rs"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
ariel-rs = { version = "=0.4.0", default-features = false }
[profile.release]
debug = false
