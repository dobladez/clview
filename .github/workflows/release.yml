# A tag v<version> builds clv for macOS and Linux and publishes the archives as a GitHub release.
# Run by hand (workflow_dispatch), it builds them without publishing: the archives stay on the run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so one binary runs on any distribution, whatever its glibc.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags and history build.rs reads the version from (`git describe`).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      # The PDF backend builds some C (aws-lc-sys, under pdfcraft's signing), and musl wants its gcc.
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --locked --target "$TARGET"

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml's version is $version"
            exit 1
          fi
          bin="target/$TARGET/release/clv"
          # The x86_64 macOS binary is built on an arm64 runner, which can't be relied on to run it.
          if [[ "$TARGET" != x86_64-apple-darwin ]]; then
            shown=$("$bin" --version)
            echo "$shown"
            # At its tag, a release says its version alone: no commit after it (build.rs).
            if [[ "$GITHUB_REF" == refs/tags/* && "$shown" != "clv $version" ]]; then
              echo "::error::built at $GITHUB_REF_NAME, but it says $shown"
              exit 1
            fi
          fi
          name="clv-$version-$TARGET"
          mkdir -p "$name/docs"
          cp "$bin" README.md LICENSE-MIT LICENSE-APACHE "$name/"
          # The manual, where the README's link finds it.
          cp docs/usage.md "$name/docs/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: clv-*.tar.gz*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # The notes are the version's section of CHANGELOG.md. tests/docs.rs holds it to having one.
      - name: notes
        run: |
          set -euo pipefail
          awk -v version="${GITHUB_REF_NAME#v}" -f .github/release-notes.awk CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has nothing under ${GITHUB_REF_NAME#v}"
            exit 1
          fi
      # With --notes-file, --generate-notes adds only its link to what changed since the last tag.
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # A job of its own: the release stands if this fails, and `gh run rerun --failed` tries it again.
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: formula
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern '*.sha256' --dir sums
          sh .github/homebrew-formula.sh "${GITHUB_REF_NAME#v}" sums > clv.rb
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: tap
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::no HOMEBREW_TAP_TOKEN secret: CONTRIBUTING.md's Releases says how to make one"
            exit 1
          fi
          formula=repos/dobladez/homebrew-tap/contents/Formula/clv.rb
          sha=$(gh api "$formula" --jq .sha)
          gh api --method PUT "$formula" --silent -f message="clv ${GITHUB_REF_NAME#v}" -f sha="$sha" \
            -f content="$(base64 < clv.rb | tr -d '\n')"
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
